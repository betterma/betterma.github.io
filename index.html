<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>首页导航 - 蚂蚱导航</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      font-family: 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Arial', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8f7ff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 92, 196, 0.45) 0, rgba(255, 92, 196, 0) 26%),
        radial-gradient(circle at 80% 20%, rgba(98, 255, 227, 0.35) 0, rgba(98, 255, 227, 0) 22%),
        radial-gradient(circle at 50% 80%, rgba(120, 122, 255, 0.4) 0, rgba(120, 122, 255, 0) 24%),
        linear-gradient(135deg, #140d2f 0%, #24185f 45%, #0e2147 100%);
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(38px);
      opacity: 0.4;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }

    body::before {
      top: -80px;
      left: -60px;
      background: rgba(255, 103, 178, 0.35);
    }

    body::after {
      bottom: -90px;
      right: -80px;
      background: rgba(78, 197, 255, 0.3);
      animation-duration: 13s;
    }

    @keyframes float {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(20px, -20px, 0) scale(1.08); }
    }

    .page-shell {
      width: min(100%, 980px);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 3.2vw, 2.8rem);
      letter-spacing: 0.06em;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.22);
    }

    .subtitle {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.98rem;
      letter-spacing: 0.04em;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.1rem;
      margin-bottom: 1.2rem;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 128px;
      padding: 1.2rem 0.9rem;
      text-decoration: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.11);
      box-shadow: 0 12px 32px rgba(8, 15, 37, 0.28);
      backdrop-filter: blur(16px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 70%);
      pointer-events: none;
    }

    .nav-item:hover,
    .nav-item:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(8, 15, 37, 0.35);
      background: rgba(255, 255, 255, 0.16);
    }

    .nav-item:active {
      transform: scale(0.97);
    }

    .nav-icon {
      width: 50px;
      height: 50px;
      margin-bottom: 0.7rem;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .more-section {
      border-radius: 24px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(8, 15, 37, 0.22);
      backdrop-filter: blur(16px);
    }

    .more-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .more-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .more-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 0.92rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .more-chip:hover,
    .more-chip:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 720px) {
      body {
        padding: 24px 12px 32px;
      }

      .nav-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
      }

      .nav-item {
        min-height: 110px;
        padding: 1rem 0.7rem;
        font-size: 0.95rem;
        border-radius: 20px;
      }

      .nav-icon {
        width: 42px;
        height: 42px;
        font-size: 1.4rem;
        border-radius: 12px;
      }

      .more-links {
        gap: 0.6rem;
      }

      .more-chip {
        flex: 1 1 calc(50% - 0.6rem);
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .nav-grid {
        grid-template-columns: 1fr 1fr;
      }

      .more-chip {
        flex-basis: 100%;
      }
    }
  </style>
</head>

  <script>
    // 强制刷新缓存
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    
    // 清除浏览器缓存
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    
    // 添加版本信息到控制台
    console.log('蚂蚱导航 v20250105 - 缓存已清除');
