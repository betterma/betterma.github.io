<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>首页导航 - 蚂蚱导航</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0e5ec 0%, #f5f6fa 100%);
      font-family: 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 2rem;
      color: #333;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px #fff8, 0 1px 0 #fff;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 2rem;
      width: 90vw;
      max-width: 700px;
      margin: 0 auto;
    }
    .nav-item {
      background: #f7f8fa;
      border-radius: 28px;
      box-shadow: 0 6px 24px #bfc9d8aa, 0 1.5px 0 #fff inset;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.2rem 1rem 1.2rem 1rem;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      color: #222;
      font-size: 1.15rem;
      font-weight: 500;
      position: relative;
      overflow: hidden;
    }
    .nav-item:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px #bfc9d8cc;
    }
    .nav-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #e0e5ec 0%, #f5f6fa 100%);
      box-shadow: 0 2px 8px #bfc9d8aa, 0 1.5px 0 #fff inset;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    /* 更多 下拉 */
    .more-dropdown {
      position: relative;
      width: 100%;
      /* 允许下拉内容超出父项显示，避免被 .nav-item 的 overflow:hidden 裁切 */
      overflow: visible;
    }
    .dropdown-button {
      width: 100%;
      border-radius: 28px;
      padding: 1.2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      background: linear-gradient(180deg,#fafbfd,#eef2f7);
      box-shadow: 0 6px 18px #c7d1e1aa;
    }
    .dropdown-content {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      left: 0;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(17,24,39,0.12);
      padding: 8px;
      display: none;
      z-index: 9999;
      min-width: 180px;
    }
    .dropdown-content a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: #111827;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.98rem;
    }
    .dropdown-content a:hover { background: #f3f4f6; }
    .dropdown-open .dropdown-content { display: block !important; z-index: 9999; }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.4rem;
        margin-bottom: 1.2rem;
      }
      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.2rem;
        width: 98vw;
        max-width: 400px;
      }
      .nav-item {
        padding: 1.2rem 0.5rem 0.7rem 0.5rem;
        font-size: 1rem;
        border-radius: 18px;
      }
      .nav-icon {
        width: 38px;
        height: 38px;
        font-size: 1.3rem;
        border-radius: 10px;
      }
      .dropdown-content { position: static; margin-top: 8px; box-shadow: none; }
    }
  </style>
</head>
<body>
  <h1>蚂蚱导航</h1>
  <div class="nav-grid">
    <!-- 仅保留重点入口，其他收纳到“更多” -->
    <a class="nav-item" href="https://betterma.github.io/pages" target="_blank">
      <div class="nav-icon">📊</div>
      数据处理
    </a>
    <a class="nav-item" href="https://betterma.github.io/memory?v=20250105" target="_blank">
      <div class="nav-icon">🧠</div>
      蚂蚱记忆
    </a>

    <div class="more-dropdown nav-item" id="moreDropdown">
      <div class="dropdown-button" id="moreBtn" role="button" aria-haspopup="true" aria-expanded="false">
        <div class="nav-icon">⋯</div>
        更多
      </div>
      <div class="dropdown-content" aria-label="更多链接">
        <a href="https://betterma.github.io/book?v=20250105" target="_blank"><span>📚</span> 阅读资源</a>
        <a href="https://betterma.github.io/cook?v=20250105" target="_blank"><span>👨‍🍳</span> 我是厨神</a>
        <a href="jinfeng/index.html?v=20250105" target="_blank"><span>🏠</span> 租赁管理</a>
        <a href="vedio/index.html?v=20250105" target="_blank"><span>🧭</span> 搬运流程</a>
        <a href="encry/index.html?v=20250105" target="_blank"><span>MI</span> 加MI工具</a>
        <a href="ipcheck/ipcheck.html?v=20250105" target="_blank"><span>🔎</span> IP Check</a>
        <a href="baby_plan/time/index.html?v=20250105" target="_blank"><span>🏖️</span> 请假排期</a>
      </div>
    </div>
  </div>
  
  <script>
    // 强制刷新缓存
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    
    // 清除浏览器缓存
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    
    // 添加版本信息到控制台
    console.log('蚂蚱导航 v20250105 - 缓存已清除');
  </script>

  <script>
    (function() {
      var moreBtn = document.getElementById('moreBtn');
      var moreDropdown = document.getElementById('moreDropdown');
      if (!moreBtn || !moreDropdown) return;

      function closeDropdown() {
        moreDropdown.classList.remove('dropdown-open');
        moreBtn.setAttribute('aria-expanded','false');
      }
      function openDropdown() {
        moreDropdown.classList.add('dropdown-open');
        moreBtn.setAttribute('aria-expanded','true');
      }

      // 点击切换（移动端友好）
      moreBtn.addEventListener('click', function(e){
        e.preventDefault();
        // 切换显示状态
        if (moreDropdown.classList.contains('dropdown-open')) closeDropdown(); else openDropdown();
      });

      // 点击外部关闭（仅当点击目标不在下拉容器内时）
      document.addEventListener('click', function(e){ if (!moreDropdown.contains(e.target)) closeDropdown(); });

      // Esc 关闭
      document.addEventListener('keyup', function(e){ if (e.key === 'Escape') closeDropdown(); });

      // 在窗口调整时关闭
      window.addEventListener('resize', closeDropdown);
    })();
  </script>
</body>
</html>
