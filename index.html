<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>蚂蚱导航 · 工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-alt: #fafbfc;
      --line: #e5e8ed;
      --line-strong: #d3d9e2;
      --ink: #1d2430;
      --ink-2: #4a5566;
      --muted: #8993a3;
      --accent: #3b6fe0;
      --accent-soft: #edf3ff;
      --danger: #d64545;
      --success: #1f9d63;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(22, 31, 44, 0.05), 0 4px 14px rgba(22, 31, 44, 0.04);
      --shadow-hover: 0 6px 20px rgba(22, 31, 44, 0.10);
      --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; color: var(--ink); font-family: var(--sans);
      background: var(--bg); -webkit-font-smoothing: antialiased;
    }

    /* —— 顶栏 —— */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 1080px; margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
      background: var(--accent); color: #fff; display: grid; place-items: center;
      font: 700 14px/1 var(--sans);
    }
    .brand-name { font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
    .brand-sub { font-size: 11px; color: var(--muted); margin-left: 2px; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .clock { font: 12px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .btn {
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
      padding: 7px 13px; border-radius: 7px; cursor: pointer;
      font: 500 12px/1.3 var(--sans); white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.primary:hover { background: #2f60c9; color: #fff; }
    .btn.ghost-danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: wait; }

    .shell { max-width: 1080px; margin: 0 auto; padding: 34px 24px 64px; }

    /* —— 概览 —— */
    .overview {
      display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end;
      margin-bottom: 26px;
    }
    .overview h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 7px; }
    .overview p { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }
    .stats { display: flex; gap: 10px; }
    .stat {
      min-width: 84px; padding: 12px 14px; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .stat b { display: block; font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: var(--muted); }
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px;
    }
    .search {
      flex: 1 1 260px; position: relative;
    }
    .search input {
      width: 100%; padding: 11px 13px 11px 38px; font: 13px/1.4 var(--sans);
      color: var(--ink); background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search input::placeholder { color: var(--muted); }
    .search-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--muted); pointer-events: none;
    }
    .toolbar-hint { font-size: 12px; color: var(--muted); }

    /* —— 分组 —— */
    .group { margin-bottom: 26px; }
    .group-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 0 2px;
    }
    .group-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    .group-title { font-size: 14px; font-weight: 650; }
    .group-sub { font-size: 12px; color: var(--muted); }
    .group-count {
      font: 11px/1 var(--mono); color: var(--muted);
      background: #eef0f4; padding: 4px 8px; border-radius: 20px;
    }
    .group-line { flex: 1; height: 1px; background: var(--line); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 12px; }
    .grid.compact { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }

    .card {
      position: relative; display: flex; align-items: flex-start; gap: 12px;
      min-height: 92px; padding: 16px; text-decoration: none; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .card.compact { min-height: 78px; padding: 14px; }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px); box-shadow: var(--shadow-hover);
      border-color: var(--line-strong); outline: none;
    }
    .card-icon {
      width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto;
      display: grid; place-items: center; font: 600 14px/1 var(--mono);
      background: var(--accent-soft); color: var(--accent);
    }
    .card-body { min-width: 0; flex: 1; }
    .card-code { display: block; font: 10px/1.2 var(--mono); color: var(--muted); margin-bottom: 5px; letter-spacing: 0.03em; }
    .card-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .card-hint { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
    .card-arrow {
      position: absolute; right: 14px; top: 16px; color: var(--muted); font-size: 15px;
      opacity: 0; transition: opacity 0.15s, transform 0.15s;
    }
    .card:hover .card-arrow { opacity: 1; transform: translate(2px, -2px); color: var(--accent); }
    .card[data-invalid-url] { border-style: dashed; }

    .empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px;
      background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); }

    /* —— 编辑模式 —— */
    .edit-bar {
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 14px 16px; margin-bottom: 24px; background: var(--accent-soft);
      border: 1px solid #cddcf8; border-radius: var(--radius);
    }
    body.editing .edit-bar { display: flex; }
    .edit-bar .tag { font: 600 12px/1 var(--mono); color: var(--accent); letter-spacing: 0.05em; }
    .edit-bar .spacer { flex: 1; }
    .edit-group {
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; margin-bottom: 16px; background: #fbfbfd;
    }
    body:not(.editing) .edit-group { display: contents; }
    .group-fields {
      display: none; align-items: end; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
    }
    body.editing .group-fields { display: flex; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label { font: 10px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; }
    .field input, .field select {
      box-sizing: border-box; width: 100%;
      background: #fff; border: 1px solid var(--line-strong); color: var(--ink);
      padding: 8px 10px; font: 12px/1.3 var(--sans); border-radius: 6px; min-width: 0;
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field.grow { flex: 1 1 150px; }
    .inline-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding-bottom: 8px; }
    .inline-check input[type=checkbox] { width: auto; }

    /* 编辑卡片：与浏览卡片彻底分离，纯表单结构，不设 href，点击不跳转 */
    body.editing .grid,
    body.editing .grid.compact { grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; }
    body.editing .card {
      display: block; min-height: 0; padding: 0; cursor: default;
      border-style: solid; border-color: var(--line); overflow: hidden;
    }
    body.editing .card:hover { transform: none; box-shadow: var(--shadow); border-color: var(--line); }
    body.editing .card-arrow { display: none; }
    .edit-card-head {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      background: #f8f9fb; border-bottom: 1px solid var(--line);
    }
    .edit-card-head .badge {
      width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
      display: grid; place-items: center; font: 600 13px/1 var(--mono);
    }
    .edit-card-head .head-titles { min-width: 0; }
    .edit-card-head .head-code { display: block; font: 10px/1.2 var(--mono); color: var(--muted); margin-bottom: 2px; }
    .edit-card-head .head-name { display: block; font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding: 14px; }
    .edit-fields .field.full { grid-column: 1 / -1; }
    .edit-card-foot {
      display: flex; align-items: end; gap: 10px; padding: 12px 14px;
      border-top: 1px solid var(--line); background: #fcfcfd;
    }
    .edit-card-foot .field { flex: 1; }
    .add-row { display: none; margin-top: 12px; }
    body.editing .add-row { display: flex; }

    /* —— 弹窗 / 提示 —— */
    .modal {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(22, 31, 44, 0.4);
    }
    .modal.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 400px; padding: 26px; background: var(--surface);
      border-radius: 14px; box-shadow: 0 20px 60px rgba(22, 31, 44, 0.22);
    }
    .modal-box h3 { font-size: 17px; font-weight: 650; margin-bottom: 8px; }
    .modal-box p { font-size: 12.5px; line-height: 1.7; color: var(--ink-2); margin-bottom: 18px; }
    .modal-box .field { margin-bottom: 14px; }
    .modal-box input { width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; z-index: 40;
      transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
      padding: 11px 17px; background: #1d2430; color: #fff;
      border-radius: 8px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(22,31,44,0.2);
      transition: opacity 0.2s, transform 0.2s; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--danger); }

    .footer {
      max-width: 1080px; margin: 0 auto; padding: 20px 24px 40px;
      border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px;
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .topbar-inner, .shell, .footer { padding-left: 16px; padding-right: 16px; }
      .overview { grid-template-columns: 1fr; align-items: start; }
      .overview h1 { font-size: 23px; }
      .stats { flex-wrap: wrap; }
      .grid, .grid.compact { grid-template-columns: 1fr; }
      .clock { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">蚂</div>
        <span class="brand-name">蚂蚱导航</span>
        <span class="brand-sub">工作台</span>
      </div>
      <div class="topbar-right">
        <span class="clock" id="localClock">--:--:--</span>
        <button type="button" class="btn" id="editToggle">编辑布局</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div class="edit-bar" id="editBar">
      <span class="tag">EDIT MODE</span>
      <span style="font-size:12px;color:var(--ink-2);">直接修改分组与导航，保存后写入仓库</span>
      <span class="spacer"></span>
      <button type="button" class="btn" id="addGroupTopBtn">+ 新建组别</button>
      <button type="button" class="btn" id="cancelBtn">取消</button>
      <button type="button" class="btn primary" id="saveBtn">保存更改</button>
    </div>

    <div class="overview">
      <div>
        <h1>我的工作台</h1>
        <p>常用入口集中在这里，按分组管理，点击即可打开。</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="navCount">0</b><span>导航入口</span></div>
        <div class="stat"><b id="groupCount">0</b><span>分组</span></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="搜索名称、说明或链接…" autocomplete="off">
      </div>
      <span class="toolbar-hint" id="searchHint"></span>
    </div>

    <main id="navRoot" aria-live="polite"></main>
  </div>

  <footer class="footer">
    <span>蚂蚱导航 · 静态站点</span>
    <span id="footerMeta">NO TRACKING</span>
  </footer>

  <div class="modal" id="unlockModal" role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <div class="modal-box">
      <h3 id="unlockTitle">解锁写权限</h3>
      <p>与 Pages 交易台、蚂蚱记忆共用同一套保险库密码。解锁后方可把导航配置保存到仓库。</p>
      <div class="field">
        <label for="unlockPass">解密密码</label>
        <input type="password" id="unlockPass" autocomplete="current-password" placeholder="输入密码">
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);">
        <input type="checkbox" id="rememberPass" checked>
        记住密码（下次自动解锁）
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" id="unlockCancel">取消</button>
        <button type="button" class="btn primary" id="unlockSubmit">解锁</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="github-token-vault.js"></script>
  <script src="nav-admin.js"></script>
  <script>
    // 本地时钟，纯展示。
    (function () {
      var el = document.getElementById("localClock");
      function tick() {
        if (el) el.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      }
      tick();
      setInterval(tick, 1000);
    })();

    (function () {
      "use strict";

      var FALLBACK = {
        version: 1,
        groups: [
          { id: "g-core", title: "常用", sub: "高频入口", compact: false, links: [
            { id: "pl-01", code: "MEMORY", label: "蚂蚱记忆", hint: "数字记忆本 · 便签与归档", url: "https://betterma.github.io/memory" },
            { id: "pl-02", code: "PLAN", label: "蚂蚱计划", hint: "健身计划 · 长图浏览", url: "https://betterma.github.io/body" }
          ]},
          { id: "g-extended", title: "工具", sub: "效率与资源", compact: true, links: [
            { id: "pl-07", code: "CIPHER", label: "加MI工具", hint: "字母轮转工具", url: "encry/index.html" }
          ]}
        ]
      };

      var PALETTE = [
        ["#eef2ff", "#4f46e5"], ["#e8f7f0", "#16855c"], ["#fff1e8", "#c2622a"],
        ["#eaf3ff", "#2b6cb0"], ["#f3edff", "#7c3aed"], ["#fdeef3", "#c13d6b"]
      ];

      var root = document.getElementById("navRoot");
      var editToggle = document.getElementById("editToggle");
      var searchInput = document.getElementById("searchInput");
      var searchHint = document.getElementById("searchHint");
      var unlockModal = document.getElementById("unlockModal");
      var toastEl = document.getElementById("toast");
      var config = null;
      var editing = false;
      var toastTimer = null;

      function toast(message, isError) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.className = "toast show" + (isError ? " error" : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.className = "toast"; }, 3200);
      }

      function uid(prefix) {
        return (prefix || "id") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
      }

      function safeUrl(url) {
        var value = String(url || "").trim();
        if (!value) return null;
        try {
          var parsed = new URL(value, document.baseURI);
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return null;
          return parsed.href;
        } catch (_) { return null; }
      }

      function iconStyle(link) {
        var key = String(link.id || link.label || "");
        var hash = 0;
        for (var i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) | 0;
        var pair = PALETTE[Math.abs(hash) % PALETTE.length];
        return "background:" + pair[0] + ";color:" + pair[1];
      }

      function iconChar(label) {
        var text = String(label || "?").trim();
        return text ? text.charAt(0).toUpperCase() : "?";
      }

      function normalize(data) {
        var raw = data && Array.isArray(data.groups) ? data : FALLBACK;
        return {
          version: 1,
          updatedAt: raw.updatedAt || "",
          groups: raw.groups.map(function (group) {
            return {
              id: group.id || uid("g"),
              title: String(group.title || "新分组"),
              sub: String(group.sub || ""),
              compact: !!group.compact,
              links: (Array.isArray(group.links) ? group.links : []).map(function (link) {
                return {
                  id: link.id || uid("pl"),
                  code: String(link.code || "LINK"),
                  label: String(link.label || "新导航"),
                  hint: String(link.hint || ""),
                  url: String(link.url || "")
                };
              })
            };
          })
        };
      }

      function makeField(labelText, input) {
        var wrap = document.createElement("div");
        wrap.className = "field";
        var label = document.createElement("label");
        label.textContent = labelText;
        wrap.appendChild(label); wrap.appendChild(input);
        return wrap;
      }
      function makeInput(type, value, placeholder) {
        var input = document.createElement("input");
        input.type = type; input.value = value || "";
        if (placeholder) input.placeholder = placeholder;
        return input;
      }
      function makeButton(text, className, onClick) {
        var btn = document.createElement("button");
        btn.type = "button"; btn.className = className || "btn"; btn.textContent = text;
        if (onClick) btn.addEventListener("click", onClick);
        return btn;
      }
      function bindLive(input, target, key) {
        input.addEventListener("input", function () { target[key] = input.value; });
      }

      function matches(link, query) {
        if (!query) return true;
        return [link.label, link.hint, link.code, link.url]
          .join(" ").toLowerCase().indexOf(query) !== -1;
      }

      function render() {
        if (!root) return;
        root.innerHTML = "";
        var query = (searchInput && !editing ? searchInput.value.trim().toLowerCase() : "");
        var total = 0, shown = 0;

        config.groups.forEach(function (group) {
          var links = group.links.filter(function (link) { return matches(link, query); });
          total += group.links.length;
          shown += links.length;
          if (query && !links.length) return;

          var section = document.createElement("section");
          section.className = "group";

          var head = document.createElement("div");
          head.className = "group-head";
          var dot = document.createElement("span");
          dot.className = "group-dot";
          var title = document.createElement("span");
          title.className = "group-title"; title.textContent = group.title;
          var sub = document.createElement("span");
          sub.className = "group-sub"; sub.textContent = group.sub;
          var line = document.createElement("span");
          line.className = "group-line";
          var count = document.createElement("span");
          count.className = "group-count";
          count.textContent = String(group.links.length) + " 项";
          head.appendChild(dot); head.appendChild(title); head.appendChild(sub);
          head.appendChild(line); head.appendChild(count);
          section.appendChild(head);

          var editor = document.createElement("div");
          editor.className = "edit-group";

          if (editing) {
            var gf = document.createElement("div");
            gf.className = "group-fields";
            var titleIn = makeInput("text", group.title, "分组名称"); titleIn.className = "grow";
            var subIn = makeInput("text", group.sub, "说明"); subIn.className = "grow";
            bindLive(titleIn, group, "title"); bindLive(subIn, group, "sub");
            var compactLabel = document.createElement("label");
            compactLabel.className = "inline-check";
            var compactIn = document.createElement("input");
            compactIn.type = "checkbox"; compactIn.checked = !!group.compact;
            compactIn.addEventListener("change", function () { group.compact = compactIn.checked; render(); });
            compactLabel.appendChild(compactIn);
            compactLabel.appendChild(document.createTextNode("紧凑布局"));
            gf.appendChild(makeField("分组名称", titleIn));
            gf.appendChild(makeField("说明", subIn));
            gf.appendChild(compactLabel);
            gf.appendChild(makeButton("删除分组", "btn ghost-danger", function () {
              if (config.groups.length <= 1) { toast("至少保留一个分组", true); return; }
              if (!window.confirm("删除分组「" + group.title + "」？组内导航会一并移除。")) return;
              config.groups = config.groups.filter(function (g) { return g.id !== group.id; });
              render();
            }));
            editor.appendChild(gf);
          }

          var grid = document.createElement("div");
          grid.className = "grid" + (group.compact ? " compact" : "");

          links.forEach(function (link) {
            // 编辑态：纯 div 表单卡片，绝不使用 <a>，从根源上屏蔽点击跳转
            if (editing) {
              var card = document.createElement("div");
              card.className = "card";

              var head = document.createElement("div");
              head.className = "edit-card-head";
              var badge = document.createElement("span");
              badge.className = "badge";
              badge.setAttribute("style", iconStyle(link));
              badge.textContent = iconChar(link.label);
              var titles = document.createElement("span");
              titles.className = "head-titles";
              var headCode = document.createElement("span");
              headCode.className = "head-code"; headCode.textContent = link.code;
              var headName = document.createElement("span");
              headName.className = "head-name"; headName.textContent = link.label;
              titles.appendChild(headCode); titles.appendChild(headName);
              head.appendChild(badge); head.appendChild(titles);
              card.appendChild(head);

              var fields = document.createElement("div");
              fields.className = "edit-fields";
              var codeIn = makeInput("text", link.code, "如 MEMORY");
              var labelIn = makeInput("text", link.label, "显示名称");
              var hintIn = makeInput("text", link.hint, "一句话说明");
              var urlIn = makeInput("url", link.url, "https://…");
              bindLive(codeIn, link, "code"); bindLive(labelIn, link, "label");
              bindLive(hintIn, link, "hint"); bindLive(urlIn, link, "url");
              // 输入时同步更新卡片头部标题，无需重新渲染（避免输入框失焦）
              codeIn.addEventListener("input", function () { headCode.textContent = link.code; });
              labelIn.addEventListener("input", function () { headName.textContent = link.label; });
              var fCode = makeField("标识", codeIn);
              var fLabel = makeField("名称", labelIn);
              var fHint = makeField("说明", hintIn); fHint.classList.add("full");
              var fUrl = makeField("链接", urlIn); fUrl.classList.add("full");
              fields.appendChild(fCode); fields.appendChild(fLabel);
              fields.appendChild(fHint); fields.appendChild(fUrl);
              card.appendChild(fields);

              var foot = document.createElement("div");
              foot.className = "edit-card-foot";
              var move = document.createElement("select");
              config.groups.forEach(function (g) {
                var opt = document.createElement("option");
                opt.value = g.id; opt.textContent = g.title;
                if (g.id === group.id) opt.selected = true;
                move.appendChild(opt);
              });
              move.addEventListener("change", function () {
                var target = config.groups.find(function (g) { return g.id === move.value; });
                if (!target || target.id === group.id) return;
                group.links = group.links.filter(function (l) { return l.id !== link.id; });
                target.links.push(link);
                render();
                toast("已移至「" + target.title + "」");
              });
              foot.appendChild(makeField("所属分组", move));
              foot.appendChild(makeButton("删除", "btn ghost-danger", function () {
                if (!window.confirm("删除导航「" + link.label + "」？")) return;
                group.links = group.links.filter(function (l) { return l.id !== link.id; });
                render();
              }));
              card.appendChild(foot);

              grid.appendChild(card);
              return;
            }

            // 浏览态：保留原有可跳转卡片
            var href = safeUrl(link.url);
            var card = document.createElement(href ? "a" : "div");
            card.className = "card" + (group.compact ? " compact" : "");
            if (href) {
              card.href = href; card.target = "_blank"; card.rel = "noopener noreferrer";
            } else {
              card.setAttribute("data-invalid-url", "1");
            }

            var icon = document.createElement("span");
            icon.className = "card-icon";
            icon.setAttribute("style", iconStyle(link));
            icon.textContent = iconChar(link.label);
            var body = document.createElement("span");
            body.className = "card-body";
            var code = document.createElement("span");
            code.className = "card-code"; code.textContent = link.code;
            var label = document.createElement("span");
            label.className = "card-label"; label.textContent = link.label;
            var hint = document.createElement("span");
            hint.className = "card-hint"; hint.textContent = link.hint;
            body.appendChild(code); body.appendChild(label); body.appendChild(hint);
            card.appendChild(icon); card.appendChild(body);
            if (href) {
              var arrow = document.createElement("span");
              arrow.className = "card-arrow"; arrow.textContent = "↗";
              card.appendChild(arrow);
            }
            grid.appendChild(card);
          });

          if (!links.length && !editing) {
            var empty = document.createElement("div");
            empty.className = "empty"; empty.textContent = "没有匹配的导航";
            grid.appendChild(empty);
          }

          if (editing) {
            var add = document.createElement("div");
            add.className = "add-row";
            add.appendChild(makeButton("+ 在此分组新建导航", "btn", function () {
              group.links.push({ id: uid("pl"), code: "LINK", label: "新导航", hint: "说明", url: "https://" });
              render();
            }));
            editor.appendChild(add);
          }

          editor.appendChild(grid);
          section.appendChild(editor);
          root.appendChild(section);
        });

        if (editing) {
          var addGroup = document.createElement("div");
          addGroup.className = "add-row";
          addGroup.appendChild(makeButton("+ 新建分组", "btn", pushGroup));
          root.appendChild(addGroup);
        }

        var nc = document.getElementById("navCount");
        var gc = document.getElementById("groupCount");
        if (nc) nc.textContent = String(total);
        if (gc) gc.textContent = String(config.groups.length);
        var fm = document.getElementById("footerMeta");
        if (fm) fm.textContent = total + " 个入口 · " + config.groups.length + " 个分组 · 无追踪";
        if (searchHint) searchHint.textContent = query ? ("匹配 " + shown + " / " + total + " 项") : "";
      }

      function setEditing(next) {
        editing = next;
        document.body.classList.toggle("editing", editing);
        if (editToggle) editToggle.textContent = editing ? "完成编辑" : "编辑布局";
        if (searchInput) {
          searchInput.value = "";
          searchInput.disabled = editing;
          searchInput.placeholder = editing ? "编辑模式下暂不可搜索" : "搜索名称、说明或链接…";
        }
        render();
      }

      function openUnlock() {
        if (!unlockModal) return;
        var pass = document.getElementById("unlockPass");
        unlockModal.classList.add("open");
        if (pass) { pass.value = ""; pass.focus(); }
      }
      function closeUnlock() {
        if (unlockModal) unlockModal.classList.remove("open");
      }

      function pushGroup() {
        config.groups.push({ id: uid("g"), title: "新分组", sub: "说明", compact: false, links: [] });
        render();
      }

      async function onSave() {
        var saveBtn = document.getElementById("saveBtn");
        if (!window.NavAdmin) { toast("导航配置脚本未加载", true); return; }
        if (!window.NavAdmin.isUnlocked()) {
          var auto = await window.NavAdmin.tryAutoUnlock();
          if (!auto) { openUnlock(); return; }
        }
        if (saveBtn) saveBtn.disabled = true;
        try {
          config.updatedAt = new Date().toISOString().slice(0, 10);
          await window.NavAdmin.save(config);
          toast("已保存，站点更新约需 1 分钟");
          setEditing(false);
        } catch (e) {
          toast((e && e.message) || "保存失败", true);
        } finally {
          if (saveBtn) saveBtn.disabled = false;
        }
      }

      async function init() {
        var loaded = window.NavAdmin ? await window.NavAdmin.loadStatic() : null;
        config = normalize(loaded || FALLBACK);
        if (!loaded) toast("配置读取失败，已使用默认数据", true);
        render();

        if (editToggle) editToggle.addEventListener("click", function () {
          if (editing) { if (window.NavAdmin) window.NavAdmin.lock(); setEditing(false); }
          else setEditing(true);
        });
        var cancelBtn = document.getElementById("cancelBtn");
        if (cancelBtn) cancelBtn.addEventListener("click", async function () {
          var fresh = window.NavAdmin ? await window.NavAdmin.loadStatic() : null;
          config = normalize(fresh || FALLBACK);
          if (window.NavAdmin) window.NavAdmin.lock();
          setEditing(false);
          toast("已放弃修改");
        });
        var saveBtn = document.getElementById("saveBtn");
        if (saveBtn) saveBtn.addEventListener("click", function () { void onSave(); });
        var addGroupTop = document.getElementById("addGroupTopBtn");
        if (addGroupTop) addGroupTop.addEventListener("click", pushGroup);
        if (searchInput) searchInput.addEventListener("input", render);

        var unlockCancel = document.getElementById("unlockCancel");
        var unlockSubmit = document.getElementById("unlockSubmit");
        var unlockPass = document.getElementById("unlockPass");
        if (unlockCancel) unlockCancel.addEventListener("click", closeUnlock);
        if (unlockSubmit) unlockSubmit.addEventListener("click", async function () {
          unlockSubmit.disabled = true;
          try {
            var rememberEl = document.getElementById("rememberPass");
            var remember = !!(rememberEl && rememberEl.checked);
            await window.NavAdmin.unlock(unlockPass ? unlockPass.value : "", remember);
            closeUnlock();
            toast("解锁成功，请再次点击保存");
          } catch (e) {
            toast((e && e.message) || "解锁失败", true);
          } finally {
            unlockSubmit.disabled = false;
          }
        });
        if (unlockPass) unlockPass.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && unlockSubmit) unlockSubmit.click();
        });
      }

      void init();

      // 仅注销根作用域残留的旧 Service Worker，不影响其它应用。
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (list) {
          list.forEach(function (item) {
            if (item.scope === location.origin + "/") item.unregister();
          });
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
