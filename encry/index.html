<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>字母轮转工具</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; background: #f7f7f7; }
    .container { background: #fff; padding: 24px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 2px 8px #eee; }
    .input-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 20px; border: none; background: #3B83FF; color: #fff; border-radius: 4px; cursor: pointer; }
    .result { margin-top: 20px; font-size: 18px; color: #333; word-break: break-all; }
    .output-group { margin-top: 24px; display: flex; align-items: center; gap: 8px; }
    .output-group input { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="input-group">
      <label for="inputText">输入字符串：</label>
      <input type="text" id="inputText" placeholder="请输入字符串">
    </div>
    <div class="input-group">
      <label for="keyWord">加MI钥（字母）：</label>
      <input type="text" id="keyWord" placeholder="请输入MI钥，如 secret">
    </div>
    <button onclick="processText()">加MI</button>
    <div class="result" id="result"></div>
    <div class="output-group">
      <input type="text" id="reverseOutput" readonly placeholder="最终结果（已反转）">
      <button onclick="copyResult()">复制</button>
    </div>
    <div class="input-group" style="margin-top:32px;">
      <label for="reverseInput">反向解MI：</label>
      <input type="text" id="reverseInput" placeholder="请输入反转后的字符串">
    </div>
    <div class="input-group">
      <label for="reverseKeyWord">加MIMI钥（字母）：</label>
      <input type="text" id="reverseKeyWord" placeholder="请输入MI钥">
    </div>
    <button onclick="reverseProcess()">解MI</button>
    <div class="result" id="originResult"></div>
  </div>
  <script>
      // Vigenère加MI算法
      function processText() {
        const str = document.getElementById('inputText').value;
        let key = document.getElementById('keyWord').value.trim();
        if (!key.match(/^[a-zA-Z]+$/)) {
          document.getElementById('result').textContent = 'MI钥只能包含英文字母';
          document.getElementById('reverseOutput').value = '';
          return;
        }
        key = key.toLowerCase();
        let keyIndex = 0;
        const shifted = str.replace(/[a-zA-Z]/g, ch => {
          const isLower = ch >= 'a';
          const base = isLower ? 97 : 65;
          const k = key.charCodeAt(keyIndex % key.length) - 97;
          keyIndex++;
          return String.fromCharCode((ch.charCodeAt(0) - base + k) % 26 + base);
        });
        document.getElementById('result').textContent = '加MI后: ' + shifted;
        const reversed = shifted.split('').reverse().join('');
        document.getElementById('reverseOutput').value = reversed;
      }
    function copyResult() {
      const output = document.getElementById('reverseOutput');
      output.select();
      output.setSelectionRange(0, 9999);
      document.execCommand('copy');
    }

      // Vigenère解MI算法
      function reverseProcess() {
        const revStr = document.getElementById('reverseInput').value;
        let key = document.getElementById('reverseKeyWord').value.trim();
        if (!key.match(/^[a-zA-Z]+$/)) {
          document.getElementById('originResult').textContent = 'MI钥只能包含英文字母';
          return;
        }
        key = key.toLowerCase();
        // 先反转
        const originShifted = revStr.split('').reverse().join('');
        let keyIndex = 0;
        const origin = originShifted.replace(/[a-zA-Z]/g, ch => {
          const isLower = ch >= 'a';
          const base = isLower ? 97 : 65;
          const k = key.charCodeAt(keyIndex % key.length) - 97;
          keyIndex++;
          // JS 取模对负数有坑，需加26再取模
          return String.fromCharCode((ch.charCodeAt(0) - base - k + 26) % 26 + base);
        });
        document.getElementById('originResult').textContent = '解MI结果: ' + origin;
      }
  </script>
</body>
</html>
