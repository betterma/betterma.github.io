<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理 - 宝贝计划</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <header class="header">
        <h1>任务管理</h1>
    </header>

    <nav>
        <a href="index.html">
            <span class="nav-icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="med-checkin.html">
            <span class="nav-icon">💊</span>
            <span>打卡</span>
        </a>
        <a href="calendar.html">
            <span class="nav-icon">📅</span>
            <span>日历</span>
        </a>
        <a href="settings.html">
            <span class="nav-icon">⚙️</span>
            <span>设置</span>
        </a>
    </nav>

    <main class="page-content">
        <div class="task-controls">
            <button id="add-task" class="primary-btn">新增任务</button>
        </div>

        <div id="task-list">
            <!-- 任务列表将通过 JS 动态生成 -->
        </div>

        <dialog id="task-dialog">
            <form id="task-form">
                <h3>新增任务</h3>
                <div class="form-group">
                    <label for="task-name">任务名称</label>
                    <input type="text" id="task-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="task-dose">剂量</label>
                    <input type="text" id="task-dose" name="dose">
                </div>
                <div class="form-group">
                    <label for="task-notes">备注</label>
                    <textarea id="task-notes" name="notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="this.closest('dialog').close()">取消</button>
                    <button type="submit" class="primary-btn">保存</button>
                </div>
            </form>
        </dialog>
    </main>

    <footer>
        <p>&copy; 2025 宝贝计划</p>
    </footer>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/tasks.js"></script>
</body>
</html>
