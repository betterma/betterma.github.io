<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 宝贝计划</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <header>
        <h1>设置</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="med-checkin.html">药物打卡</a>
            <a href="calendar.html">日历</a>
            <a href="tasks.html">任务管理</a>
        </nav>
    </header>

    <main>
        <section id="settings-panel">
            <!-- 孕期设置 -->
            <div class="settings-group">
                <h3>孕期设置</h3>
                <div class="setting-item">
                    <label for="pregnancy-start">预产期起始日期</label>
                    <input type="date" id="pregnancy-start">
                    <p class="setting-hint">当前设置: <span id="current-start">2025-09-07</span></p>
                </div>
            </div>

            <!-- 主题设置 -->
            <div class="settings-group">
                <h3>界面主题</h3>
                <div class="setting-item">
                    <label>主题色调</label>
                    <div class="theme-colors">
                        <button class="color-btn" data-theme="pink" style="background:#ff8fb1"></button>
                        <button class="color-btn" data-theme="purple" style="background:#b88fce"></button>
                        <button class="color-btn" data-theme="blue" style="background:#8fb8ff"></button>
                        <button class="color-btn" data-theme="green" style="background:#8fceb9"></button>
                    </div>
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="settings-group">
                <h3>数据管理</h3>
                <div class="setting-item">
                    <button id="clear-tasks" class="danger-btn">清除所有任务</button>
                    <button id="clear-records" class="danger-btn">清除打卡记录</button>
                    <button id="clear-all" class="danger-btn">重置所有数据</button>
                </div>
            </div>

            <!-- 关于信息 -->
            <div class="settings-group">
                <h3>关于</h3>
                <div class="about-info">
                    <p>宝贝计划 v1.0.0</p>
                    <p>一个简单的孕期管理工具</p>
                    <p>© 2025 宝贝计划</p>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/settings.js"></script>
</body>
</html>
