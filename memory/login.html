<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解锁 - 蚂蚱记忆</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-container {
      max-width: 420px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-container h1 { color: #333; margin-bottom: 8px; font-size: 1.35rem; }
    .login-container p { color: #666; margin-bottom: 22px; font-size: 14px; line-height: 1.55; }
    #passwordInput {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 13px;
      color: #555;
      text-align: left;
    }
    button#submitPassword {
      background: #2ea44f;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button#submitPassword:disabled { opacity: 0.55; cursor: wait; }
    #errorMsg { color: #c62828; margin-top: 12px; font-size: 13px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>输入密码解锁</h1>
    <p>与 Pages 交易台同一套密码：解锁后才有 GitHub 写权限。勾选记住后下次自动解锁。</p>
    <input type="password" id="passwordInput" placeholder="解密密码" autocomplete="current-password">
    <label class="remember">
      <input type="checkbox" id="rememberPass" checked>
      记住密码（下次自动解锁）
    </label>
    <button type="button" id="submitPassword">确认并进入</button>
    <div id="errorMsg" aria-live="polite"></div>
  </div>
  <script src="../github-token-vault.js"></script>
  <script>
    (function () {
      const passInput = document.getElementById("passwordInput");
      const rememberEl = document.getElementById("rememberPass");
      const err = document.getElementById("errorMsg");
      const btn = document.getElementById("submitPassword");
      const vault = window.GithubTokenVault;

      function goApp() {
        try {
          sessionStorage.setItem("isAuthed", "1");
        } catch (_) {}
        window.location.href = "index.html";
      }

      async function tryAuto() {
        if (!vault) return;
        try {
          if (await vault.tryAutoUnlock()) goApp();
        } catch (_) {}
      }

      async function submit() {
        if (err) err.textContent = "";
        if (!vault) {
          if (err) err.textContent = "保险库未加载，请检查 github-token-vault.js";
          return;
        }
        const pass = (passInput && passInput.value) || "";
        if (!pass) {
          if (err) err.textContent = "请输入密码";
          return;
        }
        if (btn) btn.disabled = true;
        try {
          await vault.unlock(pass, {
            remember: !!(rememberEl && rememberEl.checked),
          });
          goApp();
        } catch (error) {
          if (err) {
            err.textContent =
              (error && error.message) || "密码错误或密文损坏";
          }
          if (btn) btn.disabled = false;
        }
      }

      if (btn) btn.addEventListener("click", () => void submit());
      if (passInput) {
        passInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            void submit();
          }
        });
        passInput.focus();
      }
      void tryAuto();
    })();
  </script>
</body>
</html>
